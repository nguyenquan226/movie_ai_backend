name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chillflix
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: chillflix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chillflix -d chillflix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://chillflix:test-password@localhost:5432/chillflix_test
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run test:integration
      - run: npm run test:e2e -- --runInBand
